# G4OE69 - The Sims 2: Pets

[OnFrame]
# The game rewrites these four words at boot (two mtctr/b pairs in the
# 0x803CB4C0 block). Recompiled code built from the stock DOL then fails its
# hash check there and that block runs in the interpreter (the intro video
# played at ~77% on an iPad). ModernGekko's port tool applies enabled patches
# before recompiling, so the module matches what the game writes.
$Static recompile: boot-time code rewrite
0x803CD30C:dword:0x7C9043A6
0x803CD310:dword:0x4BC32FF4
0x803CD4B4:dword:0x7C9043A6
0x803CD4B8:dword:0x4BC32F4C

[OnFrame_Enabled]
$Static recompile: boot-time code rewrite
